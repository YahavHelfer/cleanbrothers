# Dedicated, disposable LOCAL CMS stack. Never link this directory to CRM/cloud.
project_id = "cleanbrothers-cms-local"

[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 56324

[storage]
# Isolated Storage service for transactional Preview-provider/RLS tests.
enabled = true
file_size_limit = "8MiB"

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:56300"
additional_redirect_urls = ["http://127.0.0.1:56300/admin/auth/confirm"]
jwt_expiry = 300
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED, so password login needs true.
# Global auth.enable_signup = false still rejects all public account creation.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
